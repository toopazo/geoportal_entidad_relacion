volumes:
  postgres_data:

services:

  # ─────────────────────────────────────────────────────────
  # postgres
  # Base de datos PostgreSQL + PostGIS.
  # Contiene muestras de 100 filas por capa curada.
  #
  # Uso:
  #   docker compose up -d postgres       levantar en background
  #   docker compose stop postgres        detener sin borrar datos
  #   docker compose down -v              borrar datos (destructivo)
  # ─────────────────────────────────────────────────────────
  postgres:
    image: postgis/postgis:16-3.4
    environment:
      POSTGRES_DB: geoportal
      POSTGRES_USER: geoportal
      POSTGRES_PASSWORD: geoportal
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data

  # ─────────────────────────────────────────────────────────
  # load-sample
  # Descarga 100 filas de una capa vía WFS y las carga en postgres.
  # También guarda la muestra como JSON en catalog/samples/.
  #
  # Requiere que postgres esté corriendo:
  #   docker compose up -d postgres
  #
  # Uso:
  #   docker compose run --rm load-sample --layer establecimientos_salud
  #   docker compose run --rm load-sample --layer establecimientos_salud --rows 50
  # ─────────────────────────────────────────────────────────
  load-sample:
    build:
      context: .
      dockerfile: Dockerfile.tools
    environment:
      DATABASE_URL: postgresql://geoportal:geoportal@localhost:5432/geoportal
    volumes:
      - ./catalog:/app/catalog
    working_dir: /app
    command: python scripts/load_sample.py
    network_mode: host

  # ─────────────────────────────────────────────────────────
  # schema-check
  # Detecta cambios de esquema en las capas del geoportal.
  #
  # Uso rápido:
  #   docker compose run --rm schema-check
  #
  # Opciones disponibles (pasar después de --):
  #   --layer establecimientos_salud   solo una capa
  #   --discover                       solo capas pendientes de verificar
  #   --save-all                       acepta cambios y sobreescribe snapshots
  #
  # Ejemplo:
  #   docker compose run --rm schema-check --layer establecimientos_salud --save-all
  # ─────────────────────────────────────────────────────────
  schema-check:
    build:
      context: .
      dockerfile: Dockerfile.tools
    volumes:
      - ./catalog:/app/catalog
    working_dir: /app
    command: python scripts/check_schema_drift.py
    network_mode: host   # necesario para salir a internet en Linux

  # ─────────────────────────────────────────────────────────
  # build-er
  # Genera catalog/er_model.json y catalog/er_model.png
  # desde los YAMLs del catálogo.
  #
  # Uso:
  #   docker compose run --rm build-er
  #   docker compose run --rm build-er --format svg
  # ─────────────────────────────────────────────────────────
  build-er:
    build:
      context: .
      dockerfile: Dockerfile.tools
    volumes:
      - ./catalog:/app/catalog
    working_dir: /app
    command: python scripts/build_er_model.py
