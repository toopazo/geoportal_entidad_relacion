columns:
  rbd:
    type: int
    human_label: "RBD (Rol Base de Datos)"
    description: "Identificador único del establecimiento educacional según MINEDUC. Equivalente al cod_vig de salud para el sector educación."
    is_pk: true
    is_fk: false
    schema_status: expected
