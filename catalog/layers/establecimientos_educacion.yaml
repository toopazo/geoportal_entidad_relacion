id: establecimientos_educacion
name: "Establecimientos de Educación Escolar"
description: >
  Catastro de establecimientos educacionales del país — colegios,
  escuelas, liceos y otras instituciones de enseñanza básica y media.
  Incluye establecimientos municipales, particulares subvencionados y
  particulares pagados. Publicado por MINEDUC en el geoportal IDE.
source: MINEDUC
organization: "Ministerio de Educación de Chile"
geoportal_id: 35408
workspace: null           # pendiente de confirmar con DescribeFeatureType
typename: null            # pendiente de confirmar
protocol: WFS
geometry_type: point
feature_count: null       # pendiente (~12.000 establecimientos estimados)
schema_status: pending_verification
last_reviewed: null
schema_hash: null

# ------------------------------------------------------------------------------
# Para qué sirve esta capa
# ------------------------------------------------------------------------------
use_cases:
  - "Distribución territorial de colegios públicos vs privados por comuna"
  - "Análisis de cobertura educacional junto con datos de población infantil (INE)"
  - "Cruzar con establecimientos de salud para análisis de infraestructura social por zona"
  - "Identificar comunas con baja razón de establecimientos por habitante en edad escolar"

# ------------------------------------------------------------------------------
# Relaciones
# ------------------------------------------------------------------------------
relations:
  - target: dpa_2023
    join_on: cut_comuna
    join_type: many_to_one
    description: "Une cada establecimiento con el polígono comunal para mapas temáticos"

  - target: ine_proyecciones_poblacion
    join_on: cut_comuna
    join_type: many_to_one
    description: "Normaliza establecimientos por población en edad escolar por comuna"

  - target: establecimientos_salud
    join_on: cut_comuna
    join_type: many_to_many
    description: "Análisis combinado de infraestructura social: salud y educación en la misma comuna"

