  identificacion:
    titulo: División Política Administrativa 2023
    resumen: 'Los Límites de la División Política Administrativa (DPA) 2023 de Chile, es un archivo shapefile
      de polígonos que se enmarca en el Trabajo del Grupo de Trabajo DPA de la IDE Chile, donde participan
      las siguientes instituciones: Subsecretaría de Desarrollo Regional y Administrativo (SUBDERE), Instituto
      Geográfico Militar (IGM), la Dirección Nacional de Fronteras y Límites del Estado (DIFROL) e Instituto
      Nacional de Estadísticas (INE); este trabajo es el resultado de la coordinación de las instituciones
      participantes para obtener una capa de la División Política del país actualizada, y que resulta
      de la unión de las capas de límites internacionales de DIFROL, los límites interiores del país de
      SUBDERE y línea de costa e islas de IGM para todo el país, su sistema de referencia es SIRGAS Chile
      y su escala de representación es 1:50.000. Cabe mencionar que esta capa no incluye el Territorio
      Antártico Chileno. Esta cartografía cuenta con la aprobación para su circulación mediante,  resolución
      exenta de DIFROL. De acuerdo a las disposiciones contenidas en el DFL Nº5 de 1967, DS Nº 566 de
      1970 y DFL Nº83 de 1979 del Ministerio de Relaciones Exteriores, toda publicación cuya circulación
      sea autorizada por esta Dirección Nacional, deberá llevar la siguiente leyenda: &amp;amp;amp;amp;quot;Autorizada
      su circulación por Resolución Nº50 del 2019 de la Dirección Nacional de Fronteras y Límites del
      Estado&amp;amp;amp;amp;quot;. La edición y circulación de mapas, cartas geográficas u otros impresos
      y documentos que se refieran o relacionen con los límites y fronteras de Chile, no comprometen,
      en modo alguno, al Estado de Chile, de acuerdo con el Art. 2º, letra g) del DFL Nº83 de 1979 del
      Ministerio de Relaciones Exteriores. Cabe considerar que aunque esta cartografía cuenta con la aprobación
      para la circulación de DIFROL, las publicaciones y productos derivados de ella deben ser revisados
      y validados de igual manera por DIFROL. Para desplegar esta capa, el usuario debe tener desplegados
      todos los shapefiles referidos al límite internacional de Chile. La cartografía se entrega separada
      en 3 shapefiles: comunas, provincias y regiones. No se considera el polígono correspondiente a la
      comuna Antártica en la región de Magallanes y de la Antártica Chilena.'
