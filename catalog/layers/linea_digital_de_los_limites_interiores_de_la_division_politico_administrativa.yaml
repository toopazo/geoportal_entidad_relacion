  identificacion:
    titulo: Línea Digital de los Límites Interiores de la División Político Administrativa
    resumen: "La cobertura de Límites de la División Político Administrativa (DPA) digital de Chile, es\
      \ un archivo de polilíneas, y representa los límites interiores de todo el país.\r\nEste trabajo\
      \ fue desarrollado por la Subsecretaría de Desarrollo Regional y Administrativa (SUBDERE) en conjunto\
      \ con el Instituto Geográfico Militar (IGM), y cuyo inicio se remonta al año 2008, formalizado a\
      \ través de un Convenio entre ambas instituciones, aprobado en Decreto Exento N° 4.763 del año 2013.\r\
      \nLos límites fueron digitalizados por IGM, usando la cartografía base escala 1:50.000 en formato\
      \ digital, siguiendo la redacción de las leyes que indican los límites de cada una de las unidades\
      \ administrativas del país: regiones, provincias y comunas. Subdere visó el trazado digital, comparándolo\
      \ con el trazado histórico que mantenía esta institución, y corrigiéndolo en los casos necesarios\
      \ según la ley vigente, trabajo que concluyó en la primera versión de la cobertura en el año 2013.\r\
      \nDebido al dinamismo del territorio y los cambios que provoca en la cartografía que de él se elabora,\
      \ Subdere revisa permanentemente la línea de límites interiores, a distintas escalas, corrigiendo\
      \ la geometría cuando corresponda para ajustarla a la descripción que hace del límite la ley vigente.\r\
      \nLa versión 7 incluye la revisión de los todos los límites trazados por linderos prediales para\
      \ las regiones del Libertador General Bernardo O¿Higgins y del Maule, sobre cartografía predial\
      \ del Centro de Información de Recursos Naturales CIREN. La cobertura de límites cuentan con un\
      \ error asociado a la digitalización de la carta base digital 1:50.000 del IGM, aun cuando se utilice\
      \ en algunos casos cartografía de mayor detalle para ubicar los distintos elementos geográficos\
      \ que utiliza la ley para describir los límites político-administrativos."
    fecha: '2022-08-16'
